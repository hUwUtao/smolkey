name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17.0.15+6"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle.lockfile
            gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-37" \
            "ndk;25.2.9519653"

      - name: Install Rust Android toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal \
            --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          cargo +1.85.1 install cargo-ndk --version 3.5.4 --locked

      - name: Verify bundled sampler bank
        run: sha256sum --check tools/instruments.smb.sha256

      - name: Build, lint, and run JVM tests
        run: ./gradlew --no-daemon --stacktrace assembleDebug lintDebug testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: smolkey-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
