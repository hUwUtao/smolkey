[package]
name = "ensemble"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib"]
bench = false

[dependencies]
dasp_sample = "0.11"
ogg = "0.9"
opus = "0.4"
smol = "2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
cpal = { version = "0.18.2", features = ["realtime"] }
jni = "0.21"
log = "0.4"
ndk-context = "0.1"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "sampler"
harness = false
